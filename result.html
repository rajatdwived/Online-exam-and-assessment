<!DOCTYPE html>
<!-- =====================================================================
     PROJECT : ExamHub - Online Examination & Assessment System
     FILE    : result.html
     The score, counts and answer review are filled in by result.js.
     ===================================================================== -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Result | ExamHub</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="result.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="logo">
          <img src="file_0000000034248211af6146cf04fec4cb.png" alt="ExamHub logo" width="25%" height="25%">
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#exams">Exams</a></li>
        </ul>
        <a href="login.html" class="btn btn-ghost">Take another test</a>
      </nav>
    </div>
  </header>

  <!-- ================= RESULT CARD ================= -->
  <main>
    <div class="container">
      <div class="result-wrap">
        <div class="result-card">
          <h1 id="resultHeading">Test completed!</h1>
          <p>Here is your result for <strong id="subjectName">your exam</strong></p>
          <p class="student-line" id="studentLine"></p>

          <!-- circular ring: result.js sets the --score value, CSS draws the ring -->
          <div class="score-ring" id="scoreRing">
            <div class="score-ring-inner">
              <strong id="scorePercent">0%</strong>
              <span>Your score</span>
            </div>
          </div>

          <p class="result-message" id="resultMessage"></p>
          <p class="result-note" id="resultNote" hidden></p>

          <div class="result-stats">
            <div><strong id="correctCount">0</strong><span>Correct</span></div>
            <div><strong id="wrongCount">0</strong><span>Wrong</span></div>
            <div><strong id="skippedCount">0</strong><span>Skipped</span></div>
          </div>

          <!-- <details> opens and closes by itself, no JavaScript needed -->
          <details class="review" id="reviewBox" hidden>
            <summary>Review your answers</summary>
            <div id="reviewList"></div>
          </details>

          <div class="result-actions">
            <a href="index.html" class="btn btn-primary btn-block">Back to home</a>
            <button type="button" class="btn btn-ghost btn-block" id="printBtn">Print result</button>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="container">
      <p class="copyright">
        &copy; 2026 ExamHub &nbsp;&bull;&nbsp; Web Development Project
        &nbsp;&bull;&nbsp; Built with HTML5 &amp; CSS3
      </p>
    </div>
  </footer>

  <script src="result.js" defer></script>

</body>
</html>
